name: Noxora CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "917301404773"
  ECR_REPOSITORY: bedrock-doc-qa
  LAMBDA_FUNCTION: bedrock-doc-qa
  API_BASE_URL: "https://lwrgo5ikf8.execute-api.us-east-1.amazonaws.com/dev"

jobs:

  # =====================================================
  # 1. TEST
  # =====================================================

  test:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install pytest
        run: |
          pip install pytest

      - name: Run pytest
        run: |
          pytest -v

      - name: Python syntax check
        run: |
          python -m compileall -q src


  # =====================================================
  # 2. DOCKER BUILD VALIDATION
  # =====================================================

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --provenance=false \
            -t bedrock-doc-qa:test \
            .


  # =====================================================
  # 3. DEPLOY TO AWS
  # =====================================================

  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    needs:
      - test
      - docker-build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # AWS OIDC
      # -------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::917301404773:role/github-actions-bedrock-doc-qa
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------------------------
      # Verify AWS identity
      # -------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -------------------------------------------------
      # Login to ECR
      # -------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------
      # Build production Docker image
      # -------------------------------------------------

      - name: Build Docker image
        run: |
          docker build --provenance=false \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      # -------------------------------------------------
      # Push Docker image
      # -------------------------------------------------

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # -------------------------------------------------
      # Deploy Lambda
      # -------------------------------------------------

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --image-uri ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            --region ${{ env.AWS_REGION }}

      # -------------------------------------------------
      # Wait for Lambda update
      # -------------------------------------------------

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --region ${{ env.AWS_REGION }}

      # -------------------------------------------------
      # Post deployment health check
      # -------------------------------------------------

      - name: Health check
        run: |

          echo "Starting Noxora health check..."

          for i in {1..10}
          do

            echo "Health check attempt $i/10"

            STATUS_CODE=$(curl \
              --silent \
              --output /tmp/health-response.json \
              --write-out "%{http_code}" \
              "${{ env.API_BASE_URL }}/health")

            echo "HTTP Status: $STATUS_CODE"

            echo "Response:"
            cat /tmp/health-response.json || true

            if [ "$STATUS_CODE" = "200" ]; then
              echo ""
              echo "======================================"
              echo "Health check PASSED"
              echo "Noxora deployment is healthy."
              echo "======================================"
              exit 0
            fi

            echo "Health check failed. Waiting 10 seconds..."
            sleep 10

          done

          echo ""
          echo "======================================"
          echo "Health check FAILED"
          echo "Deployment is considered unsuccessful."
          echo "======================================"

          exit 1


  # =====================================================
  # 4. FAILURE SUMMARY
  # =====================================================

  failure:
    name: Pipeline Failure
    runs-on: ubuntu-latest

    needs:
      - test
      - docker-build
      - deploy

    if: always() && (
      needs.test.result == 'failure' ||
      needs.docker-build.result == 'failure' ||
      needs.deploy.result == 'failure'
    )

    steps:

      - name: Pipeline failure summary
        run: |

          echo "======================================"
          echo "Noxora CI/CD Pipeline FAILED"
          echo "======================================"

          echo ""
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Branch:"
          echo "${{ github.ref_name }}"

          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"

          echo ""
          echo "Triggered by:"
          echo "${{ github.actor }}"

          echo ""
          echo "Test result:"
          echo "${{ needs.test.result }}"

          echo ""
          echo "Docker build result:"
          echo "${{ needs.docker-build.result }}"

          echo ""
          echo "Deployment result:"
          echo "${{ needs.deploy.result }}"

          echo ""
          echo "Deployment was NOT completed successfully."

          exit 1


  # =====================================================
  # 5. SUCCESS SUMMARY
  # =====================================================

  success:
    name: Deployment Successful
    runs-on: ubuntu-latest

    needs:
      - test
      - docker-build
      - deploy

    if: needs.deploy.result == 'success'

    steps:

      - name: Deployment success summary
        run: |

          echo "======================================"
          echo "Noxora CI/CD Pipeline SUCCESS"
          echo "======================================"

          echo ""
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Branch:"
          echo "${{ github.ref_name }}"

          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"

          echo ""
          echo "Tests: PASSED"
          echo "Syntax Check: PASSED"
          echo "Docker Build: PASSED"
          echo "ECR Push: PASSED"
          echo "Lambda Deployment: PASSED"
          echo "Health Check: PASSED"

          echo ""
          echo "Noxora deployment completed successfully."
