name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::917301404773:role/github-actions-bedrock-doc-qa
          aws-region: us-east-1
      - name: Build Docker image
        run: |
          docker build --provenance=false \
            -t 917301404773.dkr.ecr.us-east-1.amazonaws.com/bedrock-doc-qa:${{ github.sha }} \
            .
      - name: Push Docker image to ECR
        run: |
          docker push 917301404773.dkr.ecr.us-east-1.amazonaws.com/bedrock-doc-qa:${{ github.sha }}
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name bedrock-doc-qa \
            --image-uri 917301404773.dkr.ecr.us-east-1.amazonaws.com/bedrock-doc-qa:${{ github.sha }}
            
